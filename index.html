<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Apology for Shubhi ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #f29ab8;
      --pink-light: #ffd5e2;
      --text: #f9edf3;
      --muted: #cbb8c3;
      --border: rgba(255, 255, 255, 0.12);
      --card: rgba(255, 255, 255, 0.07);
    }

    body {
      min-height: 100vh;
      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(242, 154, 184, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(160, 130, 220, 0.14),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #120e17,
          #211522 50%,
          #10151f
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
      overflow-x: hidden;
    }

    /* --------------------------------
       BACKGROUND DECORATIONS
    -------------------------------- */

    .background-heart {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      font-size: 18px;
      animation: floatHeart linear forwards;
      z-index: 0;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(20px) scale(0.5) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.55;
      }

      100% {
        transform:
          translateY(-110vh)
          translateX(40px)
          scale(1.2)
          rotate(25deg);
        opacity: 0;
      }
    }

    /* --------------------------------
       MAIN STORY
    -------------------------------- */

    .story {
      position: relative;
      z-index: 2;

      width: min(720px, 100%);
      min-height: 650px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 35px 25px;

      border-radius: 30px;

      border: 1px solid var(--border);

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255, 180, 205, 0.08),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          rgba(255,255,255,0.06),
          rgba(255,255,255,0.025)
        );

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08);

      overflow: hidden;
    }

    .screen {
      width: min(590px, 100%);
      text-align: center;

      animation: screenIn 0.55s ease both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* --------------------------------
       TEXT
    -------------------------------- */

    .eyebrow {
      color: #d9c6d0;

      font-size: 0.75rem;
      letter-spacing: 0.17em;

      text-transform: uppercase;

      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1.02;

      letter-spacing: -0.05em;

      margin-bottom: 18px;
    }

    h2 {
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.05;

      letter-spacing: -0.045em;

      margin-bottom: 18px;
    }

    .subtitle {
      color: var(--muted);

      font-size: 1rem;
      line-height: 1.7;

      max-width: 500px;

      margin: 0 auto 28px;
    }

    /* --------------------------------
       HEART BUTTON
    -------------------------------- */

    .heart-button {
      width: 96px;
      height: 96px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.3);

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffb4d0,
          #d96f9b 50%,
          #7b3155
        );

      color: white;

      font-size: 42px;

      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 15px 40px rgba(242,154,184,0.3),
        inset 0 1px 0 rgba(255,255,255,0.35);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .heart-button:hover {
      transform: scale(1.06) translateY(-3px);

      box-shadow:
        0 20px 50px rgba(242,154,184,0.42),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .heart-button:active {
      transform: scale(0.94);
    }

    .tap-text {
      margin-top: 13px;

      color: #dcbfca;

      font-size: 0.82rem;
    }

    /* --------------------------------
       PROGRESS
    -------------------------------- */

    .progress {
      display: flex;
      justify-content: center;

      gap: 6px;

      margin-bottom: 26px;
    }

    .progress-dot {
      width: 20px;
      height: 5px;

      border-radius: 999px;

      background: rgba(255,255,255,0.13);

      transition: 0.3s ease;
    }

    .progress-dot.active {
      width: 30px;
      background: var(--pink);
    }

    /* --------------------------------
       EMOJI
    -------------------------------- */

    .big-emoji {
      font-size: 3.2rem;

      margin-bottom: 14px;

      animation: gentleFloat 2.5s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      50% {
        transform: translateY(-7px) rotate(-2deg);
      }
    }

    /* --------------------------------
       CARDS
    -------------------------------- */

    .card {
      padding: 25px;

      border-radius: 22px;

      border: 1px solid var(--border);

      background: var(--card);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card p {
      color: #eadde4;

      font-size: 1rem;

      line-height: 1.75;

      margin-bottom: 16px;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .quote {
      border-left: 3px solid var(--pink);

      padding-left: 15px;

      color: #f6dce6 !important;

      font-style: italic;
    }

    /* --------------------------------
       BUTTONS
    -------------------------------- */

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 25px;
    }

    .button {
      min-height: 46px;

      padding: 12px 20px;

      border-radius: 999px;

      border: 1px solid var(--border);

      background: rgba(255,255,255,0.07);

      color: var(--text);

      font: inherit;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .button:hover {
      background: rgba(255,255,255,0.12);

      transform: translateY(-2px);
    }

    .button.primary {
      background: var(--pink);

      color: #29151e;

      border-color: transparent;

      font-weight: 700;
    }

    .button:active {
      transform: scale(0.97);
    }

    /* --------------------------------
       TYPING TEXT
    -------------------------------- */

    .typing {
      min-height: 260px;

      text-align: left;

      white-space: pre-wrap;

      color: #eadde4;

      line-height: 1.75;

      font-size: 0.98rem;
    }

    .cursor {
      display: inline-block;

      width: 6px;
      height: 1.05em;

      margin-left: 3px;

      vertical-align: -2px;

      background: var(--pink);

      border-radius: 2px;

      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* --------------------------------
       FINAL
    -------------------------------- */

    .final-heart {
      font-size: 4rem;

      margin-bottom: 15px;

      animation: finalFloat 2s ease-in-out infinite;
    }

    @keyframes finalFloat {
      50% {
        transform: translateY(-8px) rotate(-4deg);
      }
    }

    .signature {
      margin-top: 18px;

      color: #f2c9d8;

      font-size: 0.9rem;
    }

    /* --------------------------------
       MOBILE
    -------------------------------- */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .story {
        min-height: 620px;

        padding: 30px 17px;

        border-radius: 24px;
      }

      .card {
        padding: 20px;
      }

      .card p {
        font-size: 0.95rem;
      }

      .typing {
        font-size: 0.94rem;
      }

      .heart-button {
        width: 86px;
        height: 86px;
      }
    }

  </style>
</head>

<body>

  <!-- ==========================================
       STORY CONTAINER
  =========================================== -->

  <main class="story">

    <div id="screen" class="screen"></div>

  </main>


  <script>

    /* ==========================================
       STORY DATA
    =========================================== */

    const apology = `Shubhi, I’m genuinely really sorry yaar 🥺❤️

I swear I didn’t mean that message for you at all.

Telegram was sitting in that tiny floating window while I was talking to my cousin on Instagram, and with the show running in the background, I just glanced at the messages and somehow my brain decided those messages were from Bipin 😭

And then I casually replied with my “easy dude” wala tone without even realising that you had written it. 🫠

The moment you asked me “ye kya tha group pe?” I was like…

oh no.

I’ve messed up. 😭

Please don’t think for even a second that I was trying to be disrespectful to you.

I’d never intentionally do that, especially after all the conversations we’ve had these past few days. 🥺

And honestly, I feel even worse because you trusted me enough to let me know the real Shubhi behind “Slayer” 😭.

The last thing I want is for one stupid misunderstanding and one badly-timed “easy dude” to make you feel like I don’t respect you.

So yes…

officially, sincerely, wholeheartedly…

SORRY. 🥹🤍

My brain was buffering, my Telegram was tiny, and my timing was absolutely terrible. 😭

Please forgive this idiot? 🥺

I promise  I’ll never text a word of bipin group and read the name before replying, not just the message on other groups. 😂

And please don’t become all quiet and distant with me now…

I actually really like talking to you, and I’d hate for our stupid little four-day friendship to get ruined because of something this silly. 🫶🏻

I’m sorry, Shubhi.

Really. 🤍`;


    /* ==========================================
       STATE
    =========================================== */

    const screen = document.getElementById("screen");

    let currentStep = 0;

    let typingTimer = null;


    /* ==========================================
       PROGRESS DOTS
    =========================================== */

    function progressDots() {

      let html = "";

      for (let i = 1; i <= 6; i++) {

        html += `
          <span
            class="progress-dot ${i === currentStep ? "active" : ""}">
          </span>
        `;

      }

      return `<div class="progress">${html}</div>`;
    }


    /* ==========================================
       SCREEN TRANSITION
    =========================================== */

    function changeScreen(html) {

      if (typingTimer) {
        clearTimeout(typingTimer);
      }

      screen.classList.remove("screen");

      void screen.offsetWidth;

      screen.classList.add("screen");

      screen.innerHTML = html;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* ==========================================
       BUTTON HELPER
    =========================================== */

    function nextButton(text, step) {

      return `
        <button
          type="button"
          class="button primary"
          data-next="${step}">
          ${text}
        </button>
      `;

    }


    /* ==========================================
       STORY SCREENS
    =========================================== */

    function renderStory() {

      /* ------------------------------------------
         SCREEN 0
      ------------------------------------------ */

      if (currentStep === 0) {

        changeScreen(`

          <div class="eyebrow">
            a tiny digital note
          </div>

          <div class="big-emoji">
            🥺
          </div>

          <h1>
            Shubhi…
            <br>
            I owe you an apology.
          </h1>

          <p class="subtitle">
            I could have just sent you a text.
            <br>
            But where’s the fun in that? 😭
            <br><br>
            So… I made you a tiny something.
          </p>

          <button
            type="button"
            class="heart-button"
            data-next="1"
            aria-label="Open apology">
            ❤️‍🩹
          </button>

          <div class="tap-text">
            tap the heart, please 👉🏻👈🏻
          </div>

        `);

        return;
      }


      /* ------------------------------------------
         SCREEN 1
      ------------------------------------------ */

      if (currentStep === 1) {

        changeScreen(`

          ${progressDots()}

          <div class="eyebrow">
            four days ago
          </div>

          <div class="big-emoji">
            👀
          </div>

          <h2>
            Then there was…
            <br>
            Slayer.
          </h2>

          <div class="card">

            <p>
              We met on Telegram.
              You were hiding behind the name
              <strong>“Slayer”</strong>,
              pretending to be a boy because,
              honestly, dealing with random DMs is exhausting. 😭
            </p>

            <p class="quote">
              And somehow, despite the whole
              secret-agent situation…
              we actually started talking.
            </p>

            <p>
              Deep talks.
              Random talks.
              Stupid talks.
              The kind where four days somehow
              starts feeling longer than four days.
            </p>

          </div>

          <div class="actions">

            ${nextButton(
              "okay… continue 🥹",
              2
            )}

          </div>

        `);

        return;
      }


      /* ------------------------------------------
         SCREEN 2
      ------------------------------------------ */

      if (currentStep === 2) {

        changeScreen(`

          ${progressDots()}

          <div class="eyebrow">
            plot twist
          </div>

          <div class="big-emoji">
            🕵🏻‍♀️
          </div>

          <h2>
            And then I caught you.
          </h2>

          <div class="card">

            <p>
              Not because you told me.
            </p>

            <p>
              Not because “Slayer” slipped up.
            </p>

            <p>
              It was the emojis. 😭
            </p>

            <p>
              Somehow I was like…
              <strong>
                “hmm. This is definitely a girl.”
              </strong>
              😂
            </p>

            <p>
              And eventually I got to know
              the person behind Slayer was actually
              <strong>Shubhi</strong>. 🤍
            </p>

          </div>

          <div class="actions">

            ${nextButton(
              "and then… disaster happened 💀",
              3
            )}

          </div>

        `);

        return;
      }


      /* ------------------------------------------
         SCREEN 3
      ------------------------------------------ */

      if (currentStep === 3) {

        changeScreen(`

          ${progressDots()}

          <div class="eyebrow">
            the incident
          </div>

          <div class="big-emoji">
            💀
          </div>

          <h2>
            My brain.exe
            <br>
            stopped working.
          </h2>

          <div class="card">

            <p>
              Telegram was sitting in a tiny
              floating window.
              I was talking to my cousin on Instagram.
              A show was playing in the background.
            </p>

            <p>
              Then a bunch of messages appeared
              from the owner.
            </p>

            <p>
              Someone asked whether the meeting
              was today or tomorrow.
            </p>

            <p>
              You replied that it was clearly
              written that it was today.
            </p>

            <p class="quote">
              And my genius brain looked at the
              tiny window and somehow thought
              <strong>you were Bipin.</strong> 😭
            </p>

            <p>
              So I casually dropped:
            </p>

            <p class="quote">
              “easy dude… late night 10:40
              expect nahi karte log…”
            </p>

            <p>
              …and immediately unlocked a
              brand-new achievement:
              <strong>
                “why did I do that?” 🫠
              </strong>
            </p>

          </div>

          <div class="actions">

            ${nextButton(
              "okay, now the actual apology 🤍",
              4
            )}

          </div>

        `);

        return;
      }


      /* ------------------------------------------
         SCREEN 4
      ------------------------------------------ */

      if (currentStep === 4) {

        changeScreen(`

          ${progressDots()}

          <div class="eyebrow">
            no excuses. just sorry.
          </div>

          <div class="big-emoji">
            🥺🤍
          </div>

          <h2>
            I’m really,
            <br>
            really sorry.
          </h2>

          <div class="card">

            <div
              id="typing"
              class="typing">
            </div>

          </div>

        `);

        startTyping();

        return;
      }


      /* ------------------------------------------
         SCREEN 5
      ------------------------------------------ */

      if (currentStep === 5) {

        changeScreen(`

          ${progressDots()}

          <div class="final-heart">
            🫶🏻
          </div>

          <div class="eyebrow">
            one last thing
          </div>

          <h2>
            Can we not let
            <br>
            one stupid message ruin this?
          </h2>

          <p class="subtitle">

            I genuinely like talking to you, Shubhi.

            <br><br>

            And I’d rather keep discovering
            the person behind “Slayer”
            than have my stupid floating-window
            brain ruin it. 😭

          </p>

          <div class="card">

            <strong>
              So… friends? 🥺👉🏻👈🏻
            </strong>

            <div class="signature">
              — the idiot who will read the
              name before replying next time 🤝🏻
            </div>

          </div>

          <div class="actions">

            ${nextButton(
              "YES, YOU IDIOT 😂❤️",
              0
            )}

          </div>

        `);

      }

    }


    /* ==========================================
       TYPING ANIMATION
    =========================================== */

    function startTyping() {

      const element = document.getElementById("typing");

      if (!element) {
        return;
      }

      let index = 0;

      function type() {

        if (index < apology.length) {

          element.innerHTML =
            apology.substring(0, index + 1)
            +
            `<span class="cursor"></span>`;

          index++;

          typingTimer =
            setTimeout(type, 16);

        } else {

          element.innerHTML =
            apology
            +
            `<span class="cursor"></span>`;

        }

      }

      type();

    }


    /* ==========================================
       GLOBAL STORY CLICK HANDLER
       
       IMPORTANT:
       We use event delegation here so the buttons
       continue working even after screens change.
    =========================================== */

    screen.addEventListener("click", function(event) {

      const button =
        event.target.closest("[data-next]");

      if (!button) {
        return;
      }

      const nextStep =
        Number(button.dataset.next);

      if (
        Number.isNaN(nextStep) ||
        nextStep < 0 ||
        nextStep > 5
      ) {
        return;
      }

      currentStep = nextStep;

      renderStory();

    });


    /* ==========================================
       BACKGROUND HEARTS
    =========================================== */

    function createBackgroundHeart() {

      const heart =
        document.createElement("div");

      heart.className =
        "background-heart";

      const hearts = [
        "♡",
        "♥",
        "♡",
        "💗",
        "🤍"
      ];

      heart.textContent =
        hearts[
          Math.floor(
            Math.random() * hearts.length
          )
        ];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.bottom =
        "-30px";

      heart.style.fontSize =
        (12 + Math.random() * 16) + "px";

      heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 11000);

    }


    /* ==========================================
       KEYBOARD SUPPORT
    =========================================== */

    document.addEventListener("keydown", function(event) {

      /*
        Enter / Space on the landing page
        also opens the story.
      */

      if (
        currentStep === 0 &&
        (
          event.key === "Enter" ||
          event.key === " "
        )
      ) {

        event.preventDefault();

        currentStep = 1;

        renderStory();

      }

    });


    /* ==========================================
       START EVERYTHING
    =========================================== */

    renderStory();


    setInterval(
      createBackgroundHeart,
      700
    );

  </script>

</body>
</html>
